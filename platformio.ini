
# CI/release binaries
default_envs = ttgo_t_display_geq



############ ALDIY-AUG-02=4_2026 ################
[env:ttgo_t_display_geq]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; 16MB Flash and Custom Partition Map Layout
board_build.partitions = tools/WLED_ESP32_16MB_9MB_FS.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = dio

build_flags =
  -Os
  -D ST7789_SIZE_240X135
  -D TFT_WIDTH=135
  -D TFT_HEIGHT=240
  ; Hardcoded Wi-Fi Credentials
  ; Inject environment system secrets into your build context definitions safely
  -D SECRET_SSID=\"${sysenv.WIFI_SSID}\"
  -D SECRET_PASS=\"${sysenv.WIFI_PASS}\"

lib_deps =
  moononournation/GFX Library for Arduino @ 1.4.7
  bblanchon/ArduinoJson @ ^6.21.3
  ayushsharma82/ElegantOTA @ ^3.1.0
  links2004/WebSockets @ ^2.4.1






[env:CYD_2432S028_aug_2026_GEQ_DISPLAY]
extends = esp32
board = esp32dev
board_build.partitions = ${esp32.default_partitions}
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder
build_flags = 

  -DARDUINO_USB_CDC_ON_BOOT=0 ;; this flag is mandatory for "classic ESP32" when building with arduino-esp32 >=2.0.3
  -D UM_DisplayMatrix_Pins="TFT_MOSI,TFT_SCLK,TFT_CS,TFT_DC,TFT_RST,TFT_BL" #reserved pins
  -D ILI9341_2_DRIVER     ; Screen driver for this specific CYD board variant
  -D ILI9341_2_SIZE_320X240 
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=13
  -D TFT_MISO=12
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=12            ; Shared or omitted on some boards, handled by reset pin tracking
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D CLIENT_SSID=\"${sysenv.WIFI_SSID}\" 
  -D CLIENT_PASS=\"${sysenv.WIFI_PASS}\"
lib_deps =
  moononournation/GFX Library for Arduino @ 1.4.7
  bblanchon/ArduinoJson @ ^6.21.3
  ayushsharma82/ElegantOTA @ ^3.1.0
  links2004/WebSockets @ ^2.4.1

