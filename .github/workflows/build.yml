name: Build PlatformIO Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Run PlatformIO Build
        run: pio run

      - name: Prepare Binaries and Artifact Name
        id: build_meta
        run: |
          mkdir -p build_output
          
          # Copy binaries
          find .pio/build/ -name "firmware.bin" -exec cp {} build_output/ \;
          find .pio/build/ -name "bootloader.bin" -exec cp {} build_output/ \;
          find .pio/build/ -name "partitions.bin" -exec cp {} build_output/ \;

          # Dynamically get repository name and active environment name
          REPO_NAME="${{ github.event.repository.name }}"
          
          # Automatically detects the PlatformIO environment folder name inside .pio/build/
          ENV_NAME=$(ls .pio/build/ | head -n 1)

          # Get date components (Month, Day, Year)
          MONTH=$(date +'%B')
          DAY=$(date +'%d')
          YEAR=$(date +'%Y')

          # Construct the custom artifact file name
          ARTIFACT_NAME="${REPO_NAME}-${ENV_NAME}-${MONTH}-${DAY}-${YEAR}"
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          
          echo "Generated artifact name: ${ARTIFACT_NAME}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_meta.outputs.artifact_name }}
          path: build_output/*.bin
