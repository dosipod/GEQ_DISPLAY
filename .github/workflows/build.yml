name: Build PlatformIO Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Run PlatformIO Build
        run: pio run

      - name: Copy Binaries to a Release Folder
        run: |
          mkdir -p build_output
          # Find and copy the required binaries dynamically regardless of the specific environment name folder
          find .pio/build/ -name "firmware.bin" -exec cp {} build_output/ \;
          find .pio/build/ -name "bootloader.bin" -exec cp {} build_output/ \;
          find .pio/build/ -name "partitions.bin" -exec cp {} build_output/ \;
          ls -la build_output/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-binaries
          path: build_output/*.bin
